name: CI

on:
  workflow_dispatch:
    inputs:
      reproduce-baseline:
        description: Prove the reliability regressions fail against the audited runtime
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Installs pnpm (packageManager) and Node.js (.node-version), restores
      # the store cache, and runs a frozen-lockfile install.
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - parallel:
          - name: Lint
            run: pnpm lint && pnpm format:check

          - name: Typecheck
            run: pnpm typecheck

          - name: Test
            run: pnpm test

          - name: Build
            run: pnpm build

      - name: Install Chromium for end-to-end tests
        run: pnpm exec e2e-web install chromium --with-deps

      - name: End-to-end tests
        run: pnpm test:browser

      - name: Deterministic reliability journeys
        run: pnpm test:e2e
        env:
          E2E_TELEMETRY_DISABLED: "1"

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: |
            test-results/
            .e2e/
          include-hidden-files: true
          retention-days: 7

      - name: Restore audited runtime for optional pre-fix reproduction
        if: ${{ inputs.reproduce-baseline == true }}
        run: |
          git fetch --depth=1 origin f2f110bfe7a4f46a05dba80ad630dfab56f6fae4
          git restore --source=f2f110bfe7a4f46a05dba80ad630dfab56f6fae4 -- src/audio.ts src/app.tsx src/renderer.ts
          pnpm build

      - name: Prove both regressions fail on the audited runtime
        if: ${{ inputs.reproduce-baseline == true }}
        env:
          E2E_TELEMETRY_DISABLED: "1"
        run: |
          if pnpm test:e2e; then
            echo "Expected both reliability regressions to fail against the audited runtime."
            exit 1
          fi
          jq -e '
            .run.errors == [] and
            (.run.results | length) == 3 and
            (.run.results | map(.status)) == ["failed", "failed", "passed"] and
            (.run.results[0:2] | all(.attempts[0].error.code == "ASSERTION_FAILED"))
          ' .e2e/report.json

      - name: Upload pre-fix evidence
        if: ${{ !cancelled() && inputs.reproduce-baseline == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-fix-evidence
          path: .e2e/
          include-hidden-files: true
          retention-days: 7
