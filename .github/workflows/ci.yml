name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Installs pnpm (packageManager) and Node.js (.node-version), restores
      # the store cache, and runs a frozen-lockfile install.
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - parallel:
          - name: Lint
            run: pnpm lint && pnpm format:check

          - name: Typecheck
            run: pnpm typecheck

          - name: Test
            run: pnpm test

          - name: Build
            run: pnpm build

      - name: Install Chromium for end-to-end tests
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: End-to-end tests
        run: pnpm test:browser
